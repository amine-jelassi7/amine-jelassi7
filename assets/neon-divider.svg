<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="456" y2="0">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset=".25" stop-color="#00e5ff"/>
    <stop offset=".7" stop-color="#3b6cff"/>
    <stop offset="1" stop-color="#b44dff"/>
  </linearGradient>
  <linearGradient id="gR" gradientUnits="userSpaceOnUse" x1="960" y1="0" x2="544" y2="0">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset=".25" stop-color="#00e5ff"/>
    <stop offset=".7" stop-color="#3b6cff"/>
    <stop offset="1" stop-color="#b44dff"/>
  </linearGradient>
  <linearGradient id="cL" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="456" y2="0"><stop offset="0" stop-color="#e8fbff" stop-opacity="0"/><stop offset=".3" stop-color="#e8fbff" stop-opacity=".9"/><stop offset="1" stop-color="#e8fbff" stop-opacity=".9"/></linearGradient>
  <linearGradient id="cR" gradientUnits="userSpaceOnUse" x1="960" y1="0" x2="544" y2="0"><stop offset="0" stop-color="#e8fbff" stop-opacity="0"/><stop offset=".3" stop-color="#e8fbff" stop-opacity=".9"/><stop offset="1" stop-color="#e8fbff" stop-opacity=".9"/></linearGradient>
  <radialGradient id="gHalo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#b44dff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#b44dff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="-30" width="1000" height="130">
    <feGaussianBlur stdDeviation="4" result="b1"/>
    <feGaussianBlur stdDeviation="10" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="70">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>
<style>
  .flick{animation:flick 6s infinite}
  @keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%{opacity:.55}63%{opacity:.7}}
  .spin{transform-origin:500px 35px;animation:spin 10s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{transform-origin:500px 35px;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.35);opacity:.45}}
  .tw{animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
</style>

<!-- halo behind the centre -->
<circle class="pulse" cx="500" cy="35" r="34" fill="url(#gHalo)"/>

<!-- neon lines -->
<g class="flick" filter="url(#glow)">
  <line x1="40"  y1="35" x2="456" y2="35" stroke="url(#gL)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="960" y1="35" x2="544" y2="35" stroke="url(#gR)" stroke-width="2.4" stroke-linecap="round"/>
</g>
<!-- thin bright core -->
<line x1="40"  y1="35" x2="456" y2="35" stroke="url(#cL)" stroke-width=".8" stroke-linecap="round"/>
<line x1="960" y1="35" x2="544" y2="35" stroke="url(#cR)" stroke-width=".8" stroke-linecap="round"/>

<!-- travelling light pulses -->
<g filter="url(#soft)">
  <ellipse rx="26" ry="3" cy="35" fill="#ffffff"><animate attributeName="cx" values="40;456" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3.2s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="26" ry="3" cy="35" fill="#ffffff"><animate attributeName="cx" values="960;544" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3.2s" repeatCount="indefinite"/></ellipse>
</g>

<!-- centre emblem: nested neon diamonds -->
<g filter="url(#glow)">
  <g class="spin">
    <rect x="486" y="21" width="28" height="28" fill="none" stroke="#00e5ff" stroke-width="2" transform="rotate(45 500 35)"/>
  </g>
  <rect x="492" y="27" width="16" height="16" fill="none" stroke="#b44dff" stroke-width="2" transform="rotate(45 500 35)"/>
</g>
<circle cx="500" cy="35" r="3.2" fill="#ffffff"/>

<!-- side accents -->
<g filter="url(#glow)">
  <circle cx="436" cy="35" r="3" fill="#3b6cff"/><circle cx="564" cy="35" r="3" fill="#3b6cff"/>
</g>

<!-- sparkles -->
<g fill="#ffffff">
  <circle class="tw" cx="140" cy="24" r="1.4"/><circle class="tw" cx="300" cy="47" r="1.2" style="animation-delay:-.8s"/>
  <circle class="tw" cx="380" cy="22" r="1.1" style="animation-delay:-1.5s"/><circle class="tw" cx="620" cy="48" r="1.3" style="animation-delay:-.4s"/>
  <circle class="tw" cx="700" cy="23" r="1.2" style="animation-delay:-1.9s"/><circle class="tw" cx="860" cy="46" r="1.4" style="animation-delay:-1.1s"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
